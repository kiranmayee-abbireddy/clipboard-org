# netlify.toml
[build]
  publish = "landing"

[[redirects]]
  from = "/docs"
  to = "https://github.com/kiranmayee-abbireddy/clipboard-org/blob/master/docs/ARCHITECTURE.md"
  status = 301
  force = true

[[redirects]]
  from = "/docs.html"
  to = "https://github.com/kiranmayee-abbireddy/clipboard-org/blob/master/docs/ARCHITECTURE.md"
  status = 301
  force = true

[[redirects]]
  from = "/architecture"
  to = "https://github.com/kiranmayee-abbireddy/clipboard-org/blob/master/docs/ARCHITECTURE.md"
  status = 301
  force = true

[[redirects]]
  from = "/license"
  to = "https://github.com/kiranmayee-abbireddy/clipboard-org/blob/master/LICENSE"
  status = 301
  force = true

[[redirects]]
  from = "/license.html"
  to = "https://github.com/kiranmayee-abbireddy/clipboard-org/blob/master/LICENSE"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/downloads/*.exe"
  [headers.values]
    Content-Disposition = "attachment; filename=\"ClipBox-Setup-v1.2.0.exe\""
    Content-Type = "application/octet-stream"
